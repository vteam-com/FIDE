name: Setup Flutter
description: >
  Installs the pinned Flutter SDK, the native build libraries on Linux,
  and the project's packages. Shared by the CI and Release workflows.

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.50.0'  # keep in step with the local SDK and pubspec's environment
        cache: true

    # Before any flutter command that builds native assets: the build hook
    # of cnativeapi (a transitive dependency) needs GTK 3, X11 and Xi even
    # for `flutter test`
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev

    - name: Get dependencies
      shell: bash
      run: flutter pub get
