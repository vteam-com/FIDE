name: Release

# Builds FIDE for macOS, Windows and Linux only when the code is declared
# ready, never on a plain push to main:
#   - tool/release.sh sets pubspec's version and pushes its tag (v1.2.0),
#     which tests, builds and publishes the three builds as the latest
#     GitHub Release, the README's downloads
#   - "Run workflow" on the Actions tab tests and builds any branch, the
#     builds kept as workflow artifacts only, to try a release out
# Only the latest build is kept, to save GitHub storage: a release deletes
# the older releases, and each run deletes the build artifacts of the runs
# before it (the prune job).
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # pubspec.yaml holds the version, which tool/release.sh sets and tags;
  # a tag that names another version stops the release before it tests
  version:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Check the tag matches pubspec.yaml
      if: github.ref_type == 'tag'
      run: |
        version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
        if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml's version $version; release with tool/release.sh"
          exit 1
        fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            asset: zip
          - platform: windows
            runner: windows-latest
            asset: zip
          - platform: linux
            runner: ubuntu-26.04
            asset: tar.gz
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # No version in the name, so the README's links to the latest
      # release's files (releases/latest/download/FIDE-macos.zip) always
      # find them; the release itself names the version
      ASSET: FIDE-${{ matrix.platform }}.${{ matrix.asset }}

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-flutter

    - name: Build
      run: flutter build ${{ matrix.platform }} --release

    - name: Package macOS
      if: matrix.platform == 'macos'
      run: ditto -c -k --keepParent build/macos/Build/Products/Release/FIDE.app "$ASSET"

    - name: Package Windows
      if: matrix.platform == 'windows'
      run: 7z a "$GITHUB_WORKSPACE/$ASSET" ./build/windows/x64/runner/Release/*

    - name: Package Linux
      if: matrix.platform == 'linux'
      run: tar -czf "$ASSET" -C build/linux/x64/release bundle

    # Named after the build, so the prune job only deletes FIDE builds
    - uses: actions/upload-artifact@v7
      with:
        name: FIDE-${{ matrix.platform }}
        path: ${{ env.ASSET }}
        if-no-files-found: error

  # Published at once, so the README's download links serve its builds as
  # soon as the run ends; then the older releases go, drafts included, so
  # GitHub stores only the latest build (their tags stay, for the history)
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Publish the release
      run: >
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY"
        --latest
        --generate-notes
        --verify-tag

    - name: Delete the older releases
      run: |
        gh release list --repo "$GITHUB_REPOSITORY" --json tagName \
          --jq '.[] | select(.tagName != env.GITHUB_REF_NAME) | .tagName' |
        while read -r tag; do
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
        done

  # Only the latest build is kept: a tag run's builds now live in its
  # release, so it deletes every FIDE build artifact; a manual run keeps its
  # own builds and deletes those of the runs before it. A failed release
  # keeps its builds.
  prune:
    needs: [ build, release ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
    - name: Delete the older builds
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP_RUN: ${{ github.ref_type == 'tag' && 'none' || github.run_id }}
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '
          .artifacts[]
          | select(.name | startswith("FIDE-"))
          | select(.expired | not)
          | select((.workflow_run.id | tostring) != env.KEEP_RUN)
          | .id' |
        while read -r id; do
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
        done
