name: Release

# Builds FIDE for macOS, Windows and Linux only when the code is declared
# ready, never on a plain push to main:
#   - tool/release.sh sets pubspec's version and pushes its tag (v1.2.0),
#     which tests, builds and publishes the three builds as the latest
#     GitHub Release, the README's downloads
#   - "Run workflow" on the Actions tab tests and builds any branch, the
#     builds kept as workflow artifacts only, to try a release out
# The macOS build is signed with the Developer ID certificate and notarized
# by Apple, so it opens without the Open Anyway detour; its secrets are
# listed in the README's "Signing the macOS build".
# Only the latest build is kept, to save GitHub storage: a release deletes
# the older releases, and each run deletes the build artifacts of the runs
# before it (the prune job).
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # pubspec.yaml holds the version, which tool/release.sh sets and tags;
  # a tag that names another version stops the release before it tests
  version:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Check the tag matches pubspec.yaml
      if: github.ref_type == 'tag'
      run: |
        version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
        if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml's version $version; release with tool/release.sh"
          exit 1
        fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            asset: zip
          - platform: windows
            runner: windows-latest
            asset: zip
          - platform: linux
            runner: ubuntu-26.04
            asset: tar.gz
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # No version in the name, so the README's links to the latest
      # release's files (releases/latest/download/FIDE-macos.zip) always
      # find them; the release itself names the version
      ASSET: FIDE-${{ matrix.platform }}.${{ matrix.asset }}
      # The app bundle the macOS steps sign, notarize and package
      MACOS_APP: build/macos/Build/Products/Release/FIDE.app

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-flutter

    - name: Build
      run: flutter build ${{ matrix.platform }} --release

    # Signs inside out, each framework before the app holding it, with the
    # hardened runtime and secure timestamp notarization requires. The app
    # takes Release.entitlements again: the build's own signature added
    # get-task-allow, which notarization refuses.
    - name: Sign macOS
      if: matrix.platform == 'macos'
      env:
        CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" ]]; then
          echo "::error::Set the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets: see the README's \"Signing the macOS build\""
          exit 1
        fi

        # A keychain of its own, gone with the runner, that never locks
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(uuidgen)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        base64 --decode <<<"$CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
          -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/certificate.p12"
        security set-key-partition-list -S apple-tool:,apple: -s \
          -k "$keychain_password" "$keychain" >/dev/null
        security list-keychains -d user -s "$keychain"

        identity="$(security find-identity -v -p codesigning "$keychain" |
          awk '/"Developer ID Application: / { print $2; exit }')"
        if [[ -z "$identity" ]]; then
          echo "::error::MACOS_CERTIFICATE holds no valid Developer ID Application certificate"
          exit 1
        fi

        find "$MACOS_APP/Contents/Frameworks" -depth \
          \( -name '*.framework' -o -name '*.dylib' \) -print0 |
        while IFS= read -r -d '' code; do
          codesign --force --timestamp --options runtime --sign "$identity" "$code"
        done
        codesign --force --timestamp --options runtime --sign "$identity" \
          --entitlements macos/Runner/Release.entitlements "$MACOS_APP"
        codesign --verify --strict --deep --verbose=2 "$MACOS_APP"

    # Apple's notary service scans the signed app; the ticket stapled to it
    # lets Gatekeeper open it, even offline, as any app from the Internet.
    # `notarytool submit --wait` can end well on a rejected app, so the
    # status decides, and Apple's log of a rejection says what to fix.
    - name: Notarize macOS
      if: matrix.platform == 'macos'
      timeout-minutes: 60
      env:
        API_KEY: ${{ secrets.APPLE_API_KEY }}
        API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      run: |
        if [[ -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
          echo "::error::Set the APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID secrets: see the README's \"Signing the macOS build\""
          exit 1
        fi

        printf '%s\n' "$API_KEY" >"$RUNNER_TEMP/api_key.p8"
        auth=(--key "$RUNNER_TEMP/api_key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
        submission="$RUNNER_TEMP/notarize.zip"
        result="$RUNNER_TEMP/notarization.json"
        ditto -c -k --keepParent "$MACOS_APP" "$submission"
        xcrun notarytool submit "$submission" "${auth[@]}" --wait \
          --output-format json >"$result" || true
        cat "$result"
        if [[ "$(jq -r '.status // empty' "$result" || true)" != "Accepted" ]]; then
          id="$(jq -r '.id // empty' "$result" || true)"
          [[ -z "$id" ]] || xcrun notarytool log "$id" "${auth[@]}"
          echo "::error::Apple did not notarize the app; its log above says why"
          exit 1
        fi

        xcrun stapler staple "$MACOS_APP"
        spctl --assess --type execute --verbose=2 "$MACOS_APP"

    - name: Package macOS
      if: matrix.platform == 'macos'
      run: ditto -c -k --keepParent "$MACOS_APP" "$ASSET"

    - name: Package Windows
      if: matrix.platform == 'windows'
      run: 7z a "$GITHUB_WORKSPACE/$ASSET" ./build/windows/x64/runner/Release/*

    - name: Package Linux
      if: matrix.platform == 'linux'
      run: tar -czf "$ASSET" -C build/linux/x64/release bundle

    # Named after the build, so the prune job only deletes FIDE builds
    - uses: actions/upload-artifact@v7
      with:
        name: FIDE-${{ matrix.platform }}
        path: ${{ env.ASSET }}
        if-no-files-found: error

  # Published at once, so the README's download links serve its builds as
  # soon as the run ends; then the older releases go, drafts included, so
  # GitHub stores only the latest build (their tags stay, for the history)
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Publish the release
      run: >
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY"
        --latest
        --generate-notes
        --verify-tag

    - name: Delete the older releases
      run: |
        gh release list --repo "$GITHUB_REPOSITORY" --json tagName \
          --jq '.[] | select(.tagName != env.GITHUB_REF_NAME) | .tagName' |
        while read -r tag; do
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
        done

  # Only the latest build is kept: a tag run's builds now live in its
  # release, so it deletes every FIDE build artifact; a manual run keeps its
  # own builds and deletes those of the runs before it. A failed release
  # keeps its builds.
  prune:
    needs: [ build, release ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
    - name: Delete the older builds
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP_RUN: ${{ github.ref_type == 'tag' && 'none' || github.run_id }}
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" --jq '
          .artifacts[]
          | select(.name | startswith("FIDE-"))
          | select(.expired | not)
          | select((.workflow_run.id | tostring) != env.KEEP_RUN)
          | .id' |
        while read -r id; do
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
        done
