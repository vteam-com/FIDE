name: Release

# Builds FIDE for macOS, Windows and Linux only when the code is declared
# ready, never on a plain push to main:
#   - tool/release.sh sets pubspec's version and pushes its tag (v1.2.0),
#     which tests, builds and attaches the three builds to a draft GitHub
#     Release
#   - "Run workflow" on the Actions tab tests and builds any branch, the
#     builds kept as workflow artifacts only, to try a release out
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # pubspec.yaml holds the version, which tool/release.sh sets and tags;
  # a tag that names another version stops the release before it tests
  version:
    runs-on: ubuntu-26.04
    outputs:
      name: ${{ steps.version.outputs.name }}

    steps:
    - uses: actions/checkout@v7

    - id: version
      run: |
        version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml's version $version; release with tool/release.sh"
            exit 1
          fi
        else
          # A manual run names its files after the commit
          version="$version-dev-${GITHUB_SHA::7}"
        fi
        echo "name=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ version, test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            asset: zip
          - platform: windows
            runner: windows-latest
            asset: zip
          - platform: linux
            runner: ubuntu-26.04
            asset: tar.gz
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-flutter

    - name: Name the build
      run: echo "ASSET=FIDE-${{ needs.version.outputs.name }}-${{ matrix.platform }}.${{ matrix.asset }}" >> "$GITHUB_ENV"

    - name: Build
      run: flutter build ${{ matrix.platform }} --release

    - name: Package macOS
      if: matrix.platform == 'macos'
      run: ditto -c -k --keepParent build/macos/Build/Products/Release/FIDE.app "$ASSET"

    - name: Package Windows
      if: matrix.platform == 'windows'
      run: 7z a "$GITHUB_WORKSPACE/$ASSET" ./build/windows/x64/runner/Release/*

    - name: Package Linux
      if: matrix.platform == 'linux'
      run: tar -czf "$ASSET" -C build/linux/x64/release bundle

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.platform }}
        path: ${{ env.ASSET }}
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    # A draft, so the release is published by hand once its builds are tried
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY"
        --draft
        --generate-notes
        --verify-tag
