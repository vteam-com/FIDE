name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # The Release workflow runs these tests before it builds
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-flutter

    - name: Run tests
      run: flutter test

    - name: Build Linux
      run: flutter build linux
